name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q SENSI-PPSSPP-android-project.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: cd SENSI && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SENSI-apk
          path: SENSI/app/build/outputs/apk/debug/app-debug.apk
